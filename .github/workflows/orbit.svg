<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#1F1C4D"/>
      <stop offset="1" stop-color="#0B0C2A"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="420" rx="18" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#DDD6FE">
    <circle cx="60" cy="50" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="350" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="90" r="1"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="60" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="330" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="390" r="1"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="200" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="1"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="395" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="190" r="1"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.8s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- rings -->
  <circle cx="400" cy="210" r="85" fill="none" stroke="#6D28D9" stroke-opacity="0.5" stroke-dasharray="4 6"/>
  <circle cx="400" cy="210" r="150" fill="none" stroke="#6D28D9" stroke-opacity="0.4" stroke-dasharray="4 6"/>
  <circle cx="400" cy="210" r="195" fill="none" stroke="#A78BFA" stroke-opacity="0.35" stroke-dasharray="2 12">
    <animateTransform attributeName="transform" type="rotate" from="0 400 210" to="360 400 210" dur="60s" repeatCount="indefinite"/>
  </circle>

  <!-- core -->
  <circle cx="400" cy="210" r="36" fill="url(#core)" filter="url(#glow)">
    <animate attributeName="r" values="33;40;33" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="209" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#0B0C2A">SHAKTI</text>
  <text x="400" y="222" text-anchor="middle" font-family="monospace" font-size="7" fill="#0B0C2A">ARCHITECT</text>

  <!-- inner ring: clockwise, 3 nodes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 210" to="360 400 210" dur="18s" repeatCount="indefinite"/>
    <g transform="translate(485 210)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
      <circle r="24" fill="#1F1C4D" stroke="#A78BFA" stroke-width="1.5"/>
      <text text-anchor="middle" y="3.5" font-family="monospace" font-size="10" fill="#DDD6FE">React</text>
    </g></g>
    <g transform="translate(357.5 283.6)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
      <circle r="24" fill="#1F1C4D" stroke="#A78BFA" stroke-width="1.5"/>
      <text text-anchor="middle" y="3.5" font-family="monospace" font-size="10" fill="#DDD6FE">Node</text>
    </g></g>
    <g transform="translate(357.5 136.4)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
      <circle r="24" fill="#1F1C4D" stroke="#A78BFA" stroke-width="1.5"/>
      <text text-anchor="middle" y="3.5" font-family="monospace" font-size="10" fill="#DDD6FE">Mongo</text>
    </g></g>
  </g>

  <!-- outer ring: counter-clockwise, 4 nodes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 400 210" to="0 400 210" dur="28s" repeatCount="indefinite"/>
    <g transform="translate(506.07 316.07)"><g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
      <circle r="26" fill="#1F1C4D" stroke="#C4B5FD" stroke-width="1.5"/>
      <text text-anchor="middle" y="3.5" font-family="monospace" font-size="10" fill="#DDD6FE">Flutter</text>
    </g></g>
    <g transform="translate(293.93 316.07)"><g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
      <circle r="26" fill="#1F1C4D" stroke="#C4B5FD" stroke-width="1.5"/>
      <text text-anchor="middle" y="3.5" font-family="monospace" font-size="10" fill="#DDD6FE">Dart</text>
    </g></g>
    <g transform="translate(293.93 103.93)"><g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
      <circle r="26" fill="#1F1C4D" stroke="#C4B5FD" stroke-width="1.5"/>
      <text text-anchor="middle" y="3.5" font-family="monospace" font-size="9" fill="#DDD6FE">Firebase</text>
    </g></g>
    <g transform="translate(506.07 103.93)"><g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
      <circle r="26" fill="#1F1C4D" stroke="#C4B5FD" stroke-width="1.5"/>
      <text text-anchor="middle" y="3.5" font-family="monospace" font-size="10" fill="#DDD6FE">Docker</text>
    </g></g>
  </g>
</svg>
