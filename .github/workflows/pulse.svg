<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="800" height="80" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6D28D9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- faint base line -->
  <path d="M0 40H120L140 40L150 15L165 65L178 40H300L320 40L330 10L348 70L362 40H520L540 40L550 18L565 62L578 40H800"
        fill="none" stroke="url(#fade)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- travelling comet -->
  <path d="M0 40H120L140 40L150 15L165 65L178 40H300L320 40L330 10L348 70L362 40H520L540 40L550 18L565 62L578 40H800"
        fill="none" stroke="#DDD6FE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        pathLength="1" stroke-dasharray="0.12 0.88" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0.12;-1" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
