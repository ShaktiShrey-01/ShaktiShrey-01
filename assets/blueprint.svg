<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#A78BFA" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="260" rx="18" fill="#0B0C2A"/>
  <rect width="800" height="260" rx="18" fill="url(#grid)"/>

  <text x="24" y="30" font-family="monospace" font-size="12" fill="#A78BFA">// ARCHITECTURE BLUEPRINT
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Flutter phone -->
  <g fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round">
    <rect x="60" y="55" width="80" height="140" rx="12" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.25;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <path d="M90 66H110" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0.1;0.3;0.9;1" dur="9s" repeatCount="indefinite"/>
    </path>
    <rect x="72" y="82" width="56" height="26" rx="4" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect x="72" y="118" width="56" height="26" rx="4" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect x="72" y="154" width="56" height="26" rx="4" stroke-width="1.2" stroke-opacity="0.7"/>
  </g>

  <!-- API server -->
  <g fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round">
    <rect x="320" y="85" width="160" height="80" rx="10" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0.1;0.35;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>
    <path d="M335 105H465M335 125H465M335 145H430" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- MongoDB cylinder -->
  <g fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round">
    <path d="M615 90V160A45 14 0 0 0 705 160V90" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0.2;0.45;0.9;1" dur="9s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="660" cy="90" rx="45" ry="14"/>
    <path d="M615 125A45 14 0 0 0 705 125" stroke-width="1.2" stroke-opacity="0.6"/>
  </g>

  <!-- connections -->
  <path id="p1" d="M140 125H320" fill="none" stroke="#6D28D9" stroke-width="1.5" stroke-dasharray="5 6">
    <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <path id="p2" d="M480 125H615" fill="none" stroke="#6D28D9" stroke-width="1.5" stroke-dasharray="5 6">
    <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- data packets -->
  <circle r="5" fill="#DDD6FE" filter="url(#glow)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M140 125H320"/>
  </circle>
  <circle r="5" fill="#A78BFA" filter="url(#glow)">
    <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M320 125H140"/>
  </circle>
  <circle r="5" fill="#DDD6FE" filter="url(#glow)">
    <animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M480 125H615"/>
  </circle>
  <circle r="5" fill="#A78BFA" filter="url(#glow)">
    <animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M615 125H480"/>
  </circle>

  <!-- labels -->
  <g font-family="monospace" font-size="12" fill="#DDD6FE" text-anchor="middle">
    <text x="100" y="225">FLUTTER APP</text>
    <text x="400" y="225">NODE · EXPRESS API</text>
    <text x="660" y="225">MONGODB</text>
  </g>
  <g font-family="monospace" font-size="9" fill="#A78BFA" text-anchor="middle">
    <text x="230" y="115">REST / JSON</text>
    <text x="548" y="115">QUERY</text>
  </g>
</svg>
