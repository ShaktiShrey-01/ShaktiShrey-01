<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" width="560" height="130" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F1C4D"/>
      <stop offset="1" stop-color="#0B0C2A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#DDD6FE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#DDD6FE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#DDD6FE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="560" height="130" rx="16"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="560" height="130" fill="url(#bg)"/>
    <rect x="-200" y="0" width="200" height="130" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-200;700" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="558" height="128" rx="15" fill="none" stroke="#6D28D9" stroke-opacity="0.7" stroke-width="2"/>

  <!-- emblem -->
  <g transform="translate(70 65)">
    <circle r="44" fill="none" stroke="#A78BFA" stroke-opacity="0.5" stroke-dasharray="3 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#1F1C4D" stroke="#C4B5FD" stroke-width="2" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="24s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-12 10,0 0,12 -10,0" fill="#DDD6FE" filter="url(#glow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- text -->
  <text x="140" y="48" font-family="monospace" font-size="12" fill="#A78BFA" letter-spacing="4">TITLE</text>
  <text x="140" y="80" font-family="monospace" font-size="22" font-weight="bold" fill="#DDD6FE">SEEKER OF THE</text>
  <text x="140" y="106" font-family="monospace" font-size="22" font-weight="bold" fill="#DDD6FE">ARCHITECT PATH</text>
</svg>
